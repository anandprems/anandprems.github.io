name: Notify Telegram on New Post

on:
  push:
    branches: [main]
    paths:
      - 'posts/*.html'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find changed post files
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD^ HEAD -- 'posts/*.html' 2>/dev/null | grep -v 'POST-TEMPLATE.html' || true)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Telegram message for each new/updated post
        if: steps.changed.outputs.files != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8939188527:AAFGpyICdAfVzucDbPGx9-lZkjUngZeVVh0' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '-1002099444612' }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            FILENAME=$(basename "$file")
            TITLE=$(grep -oPm1 '(?<=<title>)[^<]+' "$file" || echo "$FILENAME")
            URL="https://anandprems.github.io/posts/$FILENAME"
            TEXT=$(printf "📝 New post: %s\n%s" "$TITLE" "$URL")
            echo "Sending Telegram notification for $FILENAME..."
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${TEXT}"
          done <<< "$CHANGED_FILES"
